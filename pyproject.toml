[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-playground"
version = "0.0.1"
description = "Reinforcement learning from the Bellman equation up: planning, tabular and deep methods on one core"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=1.0"]

[project.optional-dependencies]
deep = ["torch>=2.2"]
dev = ["pytest>=7", "torch>=2.2"]
# Environment suites. Classic control and toy text need nothing beyond gymnasium.
box2d = ["gymnasium[box2d]>=1.0"]
mujoco = ["gymnasium[mujoco]>=1.0"]
atari = ["ale-py>=0.9", "opencv-python-headless"]
pettingzoo = ["pettingzoo>=1.24"]
pettingzoo-chess = ["pettingzoo>=1.24", "chess"]
pettingzoo-cards = ["pettingzoo>=1.24", "rlcard"]
pettingzoo-butterfly = ["pettingzoo>=1.24", "pygame", "pymunk"]
pettingzoo-mpe = ["pettingzoo>=1.24", "mpe2"]
pettingzoo-hanabi = ["pettingzoo>=1.24", "open_spiel"]
envs = [
    "gymnasium[box2d,mujoco]>=1.0", "ale-py>=0.9", "opencv-python-headless",
    "pettingzoo>=1.24", "chess", "rlcard", "pygame", "pymunk", "mpe2",
]

[tool.setuptools.packages.find]
include = ["rl_playground*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
