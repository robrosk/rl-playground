[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-playground"
version = "0.0.1"
description = "Reinforcement learning from the Bellman equation up: planning, tabular and deep methods on one core"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "gymnasium>=0.29"]

[project.optional-dependencies]
deep = ["torch>=2.2"]
dev = ["pytest>=7", "torch>=2.2"]

[tool.setuptools.packages.find]
include = ["rl_playground*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
